[project]
name = "migpt"
version = "0.1.0"
description = "Implementación educativa de un modelo GPT en Python."
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
